name: Build and Commit Binaries

permissions:
  contents: write
  pull-requests: write

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
      - 'feat/**'
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'cmd/**'
      - 'internal/**'
  pull_request:
    branches:
      - main
      - dev
      - 'feat/**'
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'cmd/**'
      - 'internal/**'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Run tests
        run: go test ./...
          
      - name: Build binaries
        run: |
          echo "Building rag-code-mcp..."
          go build -o bin/rag-code-mcp ./cmd/rag-code-mcp
          
          echo "Building index-all..."
          go build -o bin/index-all ./cmd/index-all
          
          echo "Building ragcode-installer..."
          go build -o bin/ragcode-installer ./cmd/install
          
          chmod +x bin/*

      - name: Stage binaries
        run: git add -f bin/

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update binaries [skip ci]"
          title: "chore: update binaries"
          body: "Auto-generated PR to update binaries after code changes."
          branch: "chore/update-binaries"
          base: ${{ github.head_ref || github.ref_name }}
          delete-branch: true
