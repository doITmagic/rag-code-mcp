name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (defaults to latest)'
        required: false

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Check for Homebrew Tap Token
        id: check_token
        run: |
          if [ -n "${{ secrets.HOMEBREW_TAP_TOKEN }}" ]; then
            echo "SKIP_HOMEBREW=" >> $GITHUB_OUTPUT
            echo "HOMEBREW_TAP_TOKEN is present. Homebrew updates enabled."
          else
            echo "SKIP_HOMEBREW=--skip=homebrew" >> $GITHUB_OUTPUT
            echo "HOMEBREW_TAP_TOKEN is missing. Homebrew Tap update will be skipped."
          fi
      
      - name: Fetch all tags
        run: git fetch --force --tags
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
      
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v5
        with:
          distribution: goreleaser
          version: v2.6.1
          args: release --clean ${{ steps.check_token.outputs.SKIP_HOMEBREW }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      
      - name: Update server.json version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          jq --arg v "$VERSION" '.version = $v' server.json > tmp && mv tmp server.json
      
      - name: Commit updated server.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add server.json
          git commit -m "chore: update server.json to version ${GITHUB_REF#refs/tags/v}" || echo "No changes to commit"
          git push origin HEAD:main || echo "Failed to push, continuing..."
