version: "2"

linters:
  settings:
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - (net.Conn).Close
        - (net.Listener).Close
        - (*net.TCPListener).Close
        - (*compress/gzip.Reader).Close
        - (*github.com/fsnotify/fsnotify.Watcher).Close
        - (*github.com/doITmagic/rag-code-mcp/internal/logger.FileLogger).Close
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Fprint
        - os.Remove
        - os.RemoveAll
        - os.Setenv
        - os.Unsetenv
    staticcheck:
      checks:
        - all
        - -QF*
        - -ST*
        - -SA1019
