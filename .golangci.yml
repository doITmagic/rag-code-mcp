version: "2"

linters:
  settings:
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - (net.Conn).Close
        - (net.Listener).Close
        - (*net.TCPListener).Close
        - (*compress/gzip.Reader).Close
        - (*github.com/fsnotify/fsnotify.Watcher).Close
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Fprint
        - (*database/sql.DB).Close
        - (*database/sql.Rows).Close
        - (*database/sql.Stmt).Close
        - (*database/sql.Tx).Rollback
        - syscall.Flock
        - os.Remove
        - os.RemoveAll
        - os.Setenv
        - os.Unsetenv
    staticcheck:
      checks:
        - all
        - -QF*
        - -ST*
        - -SA1019
  exclusions:
    rules:
      # Tests drop errors of cleanup calls (Close, Chmod back, Write to a recorder).
      - path: _test\.go
        linters:
          - errcheck
