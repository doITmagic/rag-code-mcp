# GoReleaser configuration for RagCode MCP Server
# See https://goreleaser.com for documentation

version: 2

project_name: rag-code-mcp

before:
  hooks:
    # Ensure dependencies are up to date
    - go mod download

builds:
  - id: rag-code-mcp
    main: ./cmd/rag-code-mcp
    binary: rag-code-mcp
    
    env:
      - CGO_ENABLED=0
    
    goos:
      - linux
      - darwin
      - windows
    
    goarch:
      - amd64
      - arm64
    
    # Ignore certain combinations
    ignore:
      - goos: windows
        goarch: arm64
    
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}

  - id: rag-code-install
    main: ./cmd/rag-code-install
    binary: rag-code-install
    
    env:
      - CGO_ENABLED=0
    
    goos:
      - linux
      - darwin
      - windows
    
    goarch:
      - amd64
      - arm64
    
    ignore:
      - goos: windows
        goarch: arm64
    
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}


archives:
  - id: default
    format: tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Os }}_
      {{- .Arch }}
    
    # Use zip for Windows
    format_overrides:
      - goos: windows
        format: zip
    
    files:
      - LICENSE
      - README.md

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - Merge pull request
      - Merge branch
  groups:
    - title: 'New Features'
      regexp: "^.*feat[(\\w)]*:+.*$"
      order: 0
    - title: 'Bug Fixes'
      regexp: "^.*fix[(\\w)]*:+.*$"
      order: 1
    - title: 'Performance Improvements'
      regexp: "^.*perf[(\\w)]*:+.*$"
      order: 2
    - title: 'Other Changes'
      order: 999

release:
  github:
    owner: doITmagic
    name: rag-code-mcp
  
  draft: false
  prerelease: auto
  
  name_template: "{{.ProjectName}} v{{.Version}}"
  
  header: |
    ## RagCode MCP Server v{{.Version}}
    
    Semantic code navigation using RAG (Retrieval-Augmented Generation).
    
    ### Installation
    
    **Linux (amd64):**
    ```bash
    curl -L https://github.com/doITmagic/rag-code-mcp/releases/latest/download/rag-code-mcp_linux_amd64.tar.gz | tar xz
    ./rag-code-install -y
    ```
    
    **macOS (Apple Silicon):**
    ```bash
    curl -L https://github.com/doITmagic/rag-code-mcp/releases/latest/download/rag-code-mcp_darwin_arm64.tar.gz | tar xz
    ./rag-code-install -y
    ```
    
    **Or download the archive for your platform below.**
  
  footer: |
    The installer copies the server to `~/.ragcode/bin`, starts Ollama (Docker by default; `-ollama local` uses one already running), pulls the embedding model and registers the server in the IDEs it finds. A RagCode v1 install is removed first and projects are indexed again.

    **Full documentation:** https://github.com/doITmagic/rag-code-mcp

# Homebrew tap configuration
brews:
  - repository:
      owner: doITmagic
      name: homebrew-tap
      # REQUIRED: A dedicated token (HOMEBREW_TAP_TOKEN) with write access to the tap repository.
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    
    directory: Formula
    homepage: "https://github.com/doITmagic/rag-code-mcp"
    description: "Local semantic code search for AI assistants over MCP (Go, PHP, Python, JS/TS, GDScript, HTML, docs)."
    license: "MIT"
    
    # Custom install script to handle multiple binaries
    install: |
      bin.install "rag-code-mcp"
      bin.install "rag-code-install"
    
    test: |
      system "#{bin}/rag-code-mcp --version"
