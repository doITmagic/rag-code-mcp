# RagCode MCP configuration. Written on first run; every key is optional
# and falls back to the value shown here.

# The embedding model runs on this machine, in a llama.cpp server that RagCode
# starts on first use and stops after 5 idle minutes. Runtime and model are
# downloaded once into ~/.ragcode (llama/ and models/), checked against pinned
# checksums. A download that gets almost no data for 2 minutes is stopped and
# tried again on the next call; a slow one that keeps going is not.

# Which llama.cpp build to run: cpu, vulkan (any GPU with a Vulkan driver) or
# auto: vulkan when an NVIDIA driver and a Vulkan loader are present, cpu
# otherwise. macOS always uses its one build (Metal).
embed_runtime: auto
# Your own files instead of the downloaded ones (absolute paths). Change the
# model with RagCode stopped: a file replaced while it runs is refused until
# RagCode restarts, and then every workspace is re-embedded.
# embed_model: /path/to/model.gguf
# llama_server: /path/to/llama-server
# CPU threads the model may use. Default: a third of the logical CPUs, at
# least 2, so a machine without a GPU stays usable while indexing.
# 0 lets llama.cpp use every performance core (fastest, loudest).
# embed_threads: 4
# How much of a function, class or section the model reads, in tokens (about
# 3 to 4 bytes of code each). Longer symbols are found by their first part
# only. 8192 is all the built-in model takes; a lower value indexes faster on
# a machine without a GPU, and with less memory (a symbol at the limit takes
# about 1.5 GB there). With your own embed_model, set it to that model's
# context length. Changing it makes the next index run re-embed every
# workspace.
embed_max_tokens: 8192

# Free memory (MB) needed to load the embedding model. With less, indexing and
# rag_search stop with status low_memory instead of loading a model that cannot
# start (usages, call hierarchy and package exports keep answering from the
# index). 0 turns the check off.
min_free_memory_mb: 750

log_level: info      # debug | info | warn | error
log_max_size_mb: 10

# Directory names skipped while indexing. Hidden directories (.git, .venv, ...)
# are always skipped and need no entry here.
exclude_patterns:
  - node_modules
  - vendor
  - target
  - build
  - dist
  - __pycache__

# A workspace with more indexable files than this is not indexed: the tools
# answer with the count instead, so a wrong root (a home directory, a folder of
# many projects) does not cost hours of embedding. 0 = no limit.
max_files: 20000

# When set, only roots under these directories may be indexed.
# allowed_workspace_paths:
#   - /home/me/projects

auto_index: true
watch_enabled: true
watch_debounce: 1s
auto_create_ide_rules: true

# Install newer releases over ~/.ragcode/bin/rag-code-mcp when a server starts
# (checked at most once a day). The running servers keep their binary until
# the MCP client restarts them.
auto_update: true
# Where releases come from. Empty: GitHub. For testing: a directory holding the
# release archive and checksums.txt, or a URL answering like the GitHub
# latest-release API.
# update_source: /path/to/dist
