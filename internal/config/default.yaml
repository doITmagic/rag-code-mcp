# RagCode MCP configuration. Written on first run; every key is optional
# and falls back to the value shown here.

ollama_base_url: http://localhost:11434
ollama_embed: embeddinggemma-2:270m   # needs Ollama 0.40 or later
# CPU threads Ollama may use for embeddings. Default: a third of the logical
# CPUs, at least 2, so a machine without a GPU stays usable while indexing.
# 0 lets Ollama use every performance core (fastest, loudest).
# embed_threads: 4

# Free memory (MB) a local Ollama needs to load the embedding model. With
# less, indexing and searches stop with status low_memory instead of loading
# a model that cannot start. 0 turns the check off.
min_free_memory_mb: 750

log_level: info      # debug | info | warn | error
log_max_size_mb: 10

# Directory names skipped while indexing. Hidden directories (.git, .venv, ...)
# are always skipped and need no entry here.
exclude_patterns:
  - node_modules
  - vendor
  - target
  - build
  - dist
  - __pycache__

# When set, only roots under these directories may be indexed.
# allowed_workspace_paths:
#   - /home/me/projects

auto_index: true
watch_enabled: true
watch_debounce: 1s
auto_create_ide_rules: true

# Install newer releases over ~/.ragcode/bin/rag-code-mcp when a server starts
# (checked at most once a day). The running servers keep their binary until
# the MCP client restarts them.
auto_update: true
# Where releases come from. Empty: GitHub. For testing: a directory holding the
# release archive and checksums.txt, or a URL answering like the GitHub
# latest-release API.
# update_source: /path/to/dist
