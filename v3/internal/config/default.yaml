# RagCode MCP v3 configuration. Written on first run; every key is optional
# and falls back to the value shown here.

ollama_base_url: http://localhost:11434
ollama_embed: embeddinggemma-2:270m   # needs Ollama 0.40 or later

log_level: info      # debug | info | warn | error
log_max_size_mb: 10

# Directory names skipped while indexing. Hidden directories (.git, .venv, ...)
# are always skipped and need no entry here.
exclude_patterns:
  - node_modules
  - vendor
  - target
  - build
  - dist
  - __pycache__

# When set, only roots under these directories may be indexed.
# allowed_workspace_paths:
#   - /home/me/projects

auto_index: true
watch_enabled: true
watch_debounce: 1s
auto_create_ide_rules: true
